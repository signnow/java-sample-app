spring.application.name=java-sample-app
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# App configuration
app.base-url=${APP_BASE_URL:http://localhost:8080}
signnow.api.signer_email=${SIGNNOW_SIGNER_EMAIL:test@example.com}
signnow.api.demo_user_email=${SIGNNOW_DEMO_USER_EMAIL:example@example.com}
signnow.api.demo_user_password=${SIGNNOW_DEMO_USER_PASSWORD:example}

# Actuator - restrict to health/info only
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.signnow=INFO
logging.pattern.level=%5p [%X{traceId:-},%X{spanId:-}]
